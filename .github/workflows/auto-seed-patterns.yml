name: Auto Seed 1h Patterns

# NOTE: this workflow is named "Auto Seed 1h Patterns" and seeds with
# timeframe "1h". Failure emails have referenced a 4h variant, but there is no
# 4h seeding workflow in this repo — the discrepancy is noted here rather than
# inventing one. If a 4h cadence is wanted, it needs to be added deliberately.
#
# NOTE: cron '*/12 * * * *' is 120 runs/day of GitHub Actions minutes. If a run
# legitimately takes 9-15 minutes (curl max-time + overhead), runs will queue
# more or less continuously. Either widen the interval or shrink the batch size
# to reduce queueing; this is the owner's call because it governs ingestion cadence.
# Left unchanged deliberately — revisit for cost/queueing if needed.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    # timeout-minutes must always exceed the curl --max-time below plus roughly
    # 5 minutes of step and runner overhead, so the job cap never kills the
    # step's own graceful timeout handling.
    timeout-minutes: 15

    # Overlapping runs queue instead of colliding with each other.
    concurrency:
      group: auto-seed-1h
      cancel-in-progress: false
    steps:
      - name: Select batch
        id: batch
        run: |
          SYMBOLS=(
            "AAPL" "MSFT" "NVDA" "GOOGL" "AMZN" "META" "TSLA" "JPM" "V" "UNH"
            "XOM" "LLY" "JNJ" "WMT" "MA" "AVGO" "PG" "HD" "CVX" "MRK"
            "ABBV" "COST" "KO" "PEP" "ADBE" "CRM" "AMD" "NFLX" "TMO" "ACN"
            "BAC" "WFC" "TXN" "NEE" "QCOM" "ORCL" "IBM" "GE" "CAT" "GS"
            "MS" "BKNG" "ISRG" "GILD" "VRTX" "REGN" "UBER" "ABNB" "SNOW" "CRWD"
            "NET" "DDOG" "PANW" "MU" "LRCX" "MRVL" "ARM" "PLTR" "COIN" "SQ"
            "PYPL" "SHOP" "MELI" "DASH" "ZM" "MDB" "GTLB" "CFLT" "SMCI" "INTC"
            "LOW" "INTU" "SPGI" "BLK" "RTX" "LIN" "ABT" "DHR" "PM" "AXP"
            "NKE" "DIS" "MCD" "PLD" "AMT" "ZS" "OKTA" "TWLO" "BILL" "U"
            "SPY" "QQQ" "IWM" "DIA" "VTI" "GLD" "SLV" "TLT" "XLF" "XLK"
            "XLE" "XLV" "HYG" "EEM" "ARKK" "USO" "LQD" "VEA" "VWO" "IWF"
            "BTC-USD" "ETH-USD" "SOL-USD" "BNB-USD" "XRP-USD" "ADA-USD"
            "AVAX-USD" "DOT-USD" "LINK-USD" "LTC-USD"
            "EURUSD=X" "GBPUSD=X" "USDJPY=X" "AUDUSD=X" "USDCAD=X"
            "USDCHF=X" "NZDUSD=X" "EURGBP=X" "EURJPY=X" "GBPJPY=X"
          )
          TOTAL=${#SYMBOLS[@]}
          IDX=$(( ($(date +%s) / 720) % TOTAL ))
          BATCH=""
          for i in 0 1 2 3 4 5 6 7; do
            SYM=${SYMBOLS[$(( (IDX+i) % TOTAL ))]}
            BATCH="${BATCH:+$BATCH,}$SYM"
          done
          echo "batch=$BATCH" >> $GITHUB_OUTPUT
          echo "Seeding: $BATCH (start index $IDX of $TOTAL)"

      - name: Invoke seeder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BATCH: ${{ steps.batch.outputs.batch }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY are not set. Configure them in repository secrets."
            exit 1
          fi

          SYMBOLS_JSON=$(echo "$BATCH" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")

          STATUS=$(curl -sS --max-time 480 -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/seed-historical-patterns-mtf" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"timeframe\":\"1h\",\"symbolsFilter\":$SYMBOLS_JSON,\"maxInstrumentsPerType\":999,\"forceFullBackfill\":true,\"incrementalMode\":false,\"skipDbCache\":true,\"dryRun\":false}") || CURL_FAILED=1

          echo "HTTP status: ${STATUS:-<none>}"
          echo "--- response body ---"
          # Pretty-print only if it parses as JSON; never fail merely because it doesn't.
          if [ -f /tmp/resp.json ]; then
            python3 -m json.tool /tmp/resp.json 2>/dev/null || cat /tmp/resp.json
          fi
          echo ""
          echo "---------------------"

          if [ "${CURL_FAILED:-0}" = "1" ] || [ -z "${STATUS:-}" ]; then
            echo "::warning::curl did not complete (timeout or transport error). The edge function may still be running server-side; seeded rows can land after this step."
            exit 0
          fi

          # Fail only on a real 4xx/5xx from the edge function.
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Seeder returned HTTP $STATUS"
            exit 1
          fi

          echo "Seeder invoked successfully (HTTP $STATUS)."
