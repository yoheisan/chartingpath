name: Auto Seed 1h Patterns

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select batch
        id: batch
        run: |
          SYMBOLS=(
            "AAPL" "MSFT" "NVDA" "GOOGL" "AMZN" "META" "TSLA" "JPM" "V" "UNH"
            "XOM" "LLY" "JNJ" "WMT" "MA" "AVGO" "PG" "HD" "CVX" "MRK"
            "ABBV" "COST" "KO" "PEP" "ADBE" "CRM" "AMD" "NFLX" "TMO" "ACN"
            "BAC" "WFC" "TXN" "NEE" "QCOM" "ORCL" "IBM" "GE" "CAT" "GS"
            "MS" "BKNG" "ISRG" "GILD" "VRTX" "REGN" "UBER" "ABNB" "SNOW" "CRWD"
            "NET" "DDOG" "PANW" "MU" "LRCX" "MRVL" "ARM" "PLTR" "COIN" "SQ"
            "PYPL" "SHOP" "MELI" "DASH" "ZM" "MDB" "GTLB" "CFLT" "SMCI" "INTC"
            "LOW" "INTU" "SPGI" "BLK" "RTX" "LIN" "ABT" "DHR" "PM" "AXP"
            "NKE" "DIS" "MCD" "PLD" "AMT" "ZS" "OKTA" "TWLO" "BILL" "U"
            "SPY" "QQQ" "IWM" "DIA" "VTI" "GLD" "SLV" "TLT" "XLF" "XLK"
            "XLE" "XLV" "HYG" "EEM" "ARKK" "USO" "LQD" "VEA" "VWO" "IWF"
            "BTC-USD" "ETH-USD" "SOL-USD" "BNB-USD" "XRP-USD" "ADA-USD"
            "AVAX-USD" "DOT-USD" "LINK-USD" "LTC-USD"
            "EURUSD=X" "GBPUSD=X" "USDJPY=X" "AUDUSD=X" "USDCAD=X"
            "USDCHF=X" "NZDUSD=X" "EURGBP=X" "EURJPY=X" "GBPJPY=X"
          )
          TOTAL=${#SYMBOLS[@]}
          IDX=$(( ($(date +%s) / 720) % TOTAL ))
          BATCH=""
          for i in 0 1 2 3 4 5 6 7; do
            SYM=${SYMBOLS[$(( (IDX+i) % TOTAL ))]}
            BATCH="${BATCH:+$BATCH,}$SYM"
          done
          echo "batch=$BATCH" >> $GITHUB_OUTPUT
          echo "Seeding: $BATCH (start index $IDX of $TOTAL)"

      - name: Invoke seeder
        run: |
          SYMBOLS_JSON=$(echo "${{ steps.batch.outputs.batch }}" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read().strip().split(',')))")
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/seed-historical-patterns-mtf" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"timeframe\":\"1h\",\"symbolsFilter\":$SYMBOLS_JSON,\"maxInstrumentsPerType\":999,\"forceFullBackfill\":true,\"incrementalMode\":false,\"skipDbCache\":true,\"dryRun\":false}" | python3 -m json.tool
