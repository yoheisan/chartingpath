name: Auto Seed 1h Patterns

# NOTE: this workflow is named "Auto Seed 1h Patterns" and seeds with
# timeframe "1h". Failure emails have referenced a 4h variant, but there is no
# 4h seeding workflow in this repo — the discrepancy is noted here rather than
# inventing one. If a 4h cadence is wanted, it needs to be added deliberately.
#
# NOTE: cron '*/12 * * * *' is 120 runs/day of GitHub Actions minutes. If a run
# legitimately takes 9-15 minutes (curl max-time + overhead), runs will queue
# more or less continuously. Either widen the interval or shrink the batch size
# to reduce queueing; this is the owner's call because it governs ingestion cadence.
# Left unchanged deliberately — revisit for cost/queueing if needed.

on:
  schedule:
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    # timeout-minutes must always exceed the curl --max-time below plus roughly
    # 5 minutes of step and runner overhead, so the job cap never kills the
    # step's own graceful timeout handling.
    timeout-minutes: 15

    # Overlapping runs queue instead of colliding with each other.
    concurrency:
      group: auto-seed-1h
      cancel-in-progress: false
    steps:
      # The symbol rotation that used to live here (a date-derived index into a
      # hardcoded list) has moved into the function as a persisted cursor in
      # scan_rotation_cursor. A clock-derived index repeats or skips slices
      # whenever run duration drifts; a cursor advances exactly once per run.
      - name: Invoke seeder
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -uo pipefail

          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY are not set. Configure them in repository secrets."
            exit 1
          fi

          # maxInstrumentsPerType 40 bounds the universe to ~240 symbols; the
          # function's cursor walks it 2 instruments at a time (maxPerRun),
          # covering the whole universe roughly once a day at this cadence.
          # 999 previously meant every invocation rebuilt an 800+ symbol list
          # and each run pulled 2 years of hourly bars for 3 instruments —
          # that peak is what the runtime killed with HTTP 546.
          STATUS=$(curl -sS --max-time 480 -o /tmp/resp.json -w '%{http_code}' \
            -X POST "$SUPABASE_URL/functions/v1/seed-historical-patterns-mtf" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"timeframe":"1h","maxInstrumentsPerType":40,"maxPerRun":2,"useCursor":true,"forceFullBackfill":true,"incrementalMode":false,"skipDbCache":true,"dryRun":false}') || CURL_FAILED=1

          echo "HTTP status: ${STATUS:-<none>}"
          echo "--- response body ---"
          # Pretty-print only if it parses as JSON; never fail merely because it doesn't.
          if [ -f /tmp/resp.json ]; then
            python3 -m json.tool /tmp/resp.json 2>/dev/null || cat /tmp/resp.json
          fi
          echo ""
          echo "---------------------"

          if [ "${CURL_FAILED:-0}" = "1" ] || [ -z "${STATUS:-}" ]; then
            echo "::warning::curl did not complete (timeout or transport error). The edge function may still be running server-side; seeded rows can land after this step."
            exit 0
          fi

          # 546 is Supabase's edge-runtime resource-limit code: the process was
          # terminated for exceeding its memory/CPU allowance. It is a capacity
          # condition, not a code defect, and partial progress is already
          # committed because the function flushes per instrument. Retryable —
          # the next scheduled run resumes from the persisted cursor, so the
          # job is not marked failed. seeder_error_rate (data health, critical)
          # is what escalates when this stops being occasional.
          if [ "$STATUS" = "546" ]; then
            echo "::warning::Seeder hit the edge-runtime resource limit (HTTP 546). Partial rows may have landed; the cursor advances and the next run continues. Watch the seeder_error_rate health check."
            exit 0
          fi

          # Fail only on a real 4xx/5xx from the edge function.
          if [ "$STATUS" -ge 400 ]; then
            echo "::error::Seeder returned HTTP $STATUS"
            exit 1
          fi

          echo "Seeder invoked successfully (HTTP $STATUS)."
